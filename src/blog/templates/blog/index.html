<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Blog</title>
</head>
<body>
    <h1>Le Blog</h1>
    <ul>
        {% for article in articles %}
            <li>
                <a href="{% url 'blog-article' article.id %}">{{ article.titre }}</a>
                — {{ article.date_publication|date:"d F Y" }}
            </li>
        {% empty %}
            <li>Aucun article pour le moment.</li>
        {% endfor %}
    </ul>
</body>
</html>
